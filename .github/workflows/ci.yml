name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify v4.3.2 models against published Index
        run: python src/aa_index.py --all
      - name: Verify archived v4.1.1 models against published Index
        run: python src/aa_index.py --all --weights data/weights_v4.1.1.csv --models data/models.csv
